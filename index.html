        <p class="text-slate-400 text-sm sm:text-base">
          View match schedules converted automatically to your local timezone.
          Preference is saved automatically!
        </p>

        <!-- Timezone Selector Control -->
        <div
          class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-3"
        >
          <label
            for="timezoneSelect"
            class="text-sm font-semibold text-slate-300"
            >Select Your Timezone:</label
          >
          <select
            id="timezoneSelect"
            class="bg-slate-900 border border-slate-600 text-slate-100 text-sm rounded-lg focus:ring-amber-500 focus:border-amber-500 block p-2.5 outline-none transition shadow-inner"
          >
            <!-- Populated dynamically via JavaScript -->
          </select>
        </div>
      </header>

      <!-- Fixtures Container -->
      <main>
        <div class="flex items-center justify-between mb-4">
          <h2
            class="text-xl font-bold text-slate-200 border-l-4 border-amber-500 pl-3"
          >
            Tournament Fixtures
          </h2>
          <span
            id="currentTzLabel"
            class="text-xs text-amber-400 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-full font-medium"
          ></span>
        </div>

        <div id="fixturesList" class="grid gap-4">
          <!-- Fixture cards rendered via JS -->
        </div>
      </main>
    </div>

          date: "2026-11-21",
          timeNPT: "17:00",
          venue: "Kirtipur",
        },
      ];

      // Curated List of timezones for selection
      const timezones = [
        { label: "Local Device Time (Auto)", value: "auto" },
        { label: "Nepal Time (NPT - Kathmandu)", value: "Asia/Kathmandu" },
        { label: "India Time (IST - New Delhi)", value: "Asia/Kolkata" },
        { label: "United Kingdom (GMT/BST - London)", value: "Europe/London" },
        { label: "United States (EST - New York)", value: "America/New_York" },
        {
          label: "United States (PST - Los Angeles)",
          value: "America/Los_Angeles",
        },
        { label: "United Arab Emirates (GST - Dubai)", value: "Asia/Dubai" },
        { label: "Australia (AEST - Sydney)", value: "Australia/Sydney" },
        { label: "Qatar (AST - Doha)", value: "Asia/Qatar" },
        { label: "Malaysia (MYT - Kuala Lumpur)", value: "Asia/Kuala_Lumpur" },
        { label: "UTC (Coordinated Universal Time)", value: "UTC" },
      ];

      const timezoneSelect = document.getElementById("timezoneSelect");
      const fixturesList = document.getElementById("fixturesList");
      const currentTzLabel = document.getElementById("currentTzLabel");

      function initTimezones() {
        timezoneSelect.innerHTML = "";
        timezones.forEach((tz) => {
          const opt = document.createElement("option");
          opt.value = tz.value;
          opt.textContent = tz.label;
          timezoneSelect.appendChild(opt);
        });

        // Load saved timezone from localStorage or fallback to 'auto'
        const savedTz = localStorage.getItem("npl_selected_timezone") || "auto";
        timezoneSelect.value = savedTz;
      }

      function getTargetTimezone() {
        const val = timezoneSelect.value;
        if (val === "auto") {
          return Intl.DateTimeFormat().resolvedOptions().timeZone;
        }
        return val;
      }

      function renderFixtures() {
        const targetTz = getTargetTimezone();
        currentTzLabel.textContent = `Timezone: ${targetTz}`;
        fixturesList.innerHTML = "";

        matches.forEach((match) => {
          // Parse match date and Nepal time string (UTC+5:45)
          // Nepal offset is +05:45
          const isoString = `${match.date}T${match.timeNPT}:00+05:45`;
          const matchDate = new Date(isoString);

          // Format date and time for target timezone
          const optionsDate = {
            weekday: "short",
            month: "short",
            day: "numeric",
            timeZone: targetTz,
          };
          const optionsTime = {
            hour: "numeric",
            minute: "2-digit",
            hour12: true,
            timeZone: targetTz,
          };

          const formattedDate = new Intl.DateTimeFormat(
            "en-US",
            optionsDate,
          ).format(matchDate);
          const formattedTime = new Intl.DateTimeFormat(
            "en-US",
            optionsTime,
          ).format(matchDate);

          // Original Nepal Time string for reference
          const nptDisplay = `${match.date} at ${match.timeNPT} NPT`;

          const card = document.createElement("div");
          card.className =
            "bg-slate-800 border border-slate-700/80 hover:border-amber-500/50 rounded-xl p-4 sm:p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 transition shadow-md";

          card.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="bg-amber-500/20 text-amber-400 text-xs font-bold px-2.5 py-0.5 rounded">${match.matchNo}</span>
                            <span class="text-xs text-slate-400">📍 ${match.venue} Stadium</span>
                        </div>
                        <h3 class="text-base sm:text-lg font-bold text-slate-100">${match.teams}</h3>
                        <p class="text-xs text-slate-400 mt-1">Nepal Time: ${nptDisplay}</p>
                    </div>
                    <div class="bg-slate-900/80 border border-slate-700/60 rounded-lg p-3 text-right w-full sm:w-auto min-w-[170px]">
                        <div class="text-xs text-amber-400 font-semibold uppercase tracking-wider">Your Local Time</div>
                        <div class="text-base sm:text-lg font-extrabold text-slate-100 mt-0.5">${formattedTime}</div>
                        <div class="text-xs text-slate-400">${formattedDate}</div>
                    </div>
                `;
          fixturesList.appendChild(card);
        });
      }

      // Event listener to save preference instantly to local storage
      timezoneSelect.addEventListener("change", (e) => {
        const selectedVal = e.target.value;
        localStorage.setItem("npl_selected_timezone", selectedVal);
        renderFixtures();
      });

      // Initialize App on Load
      initTimezones();
      renderFixtures();
